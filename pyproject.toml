[project]
name = "pysmo"
dynamic = ["version"]
description = "Python module to read/write/manipulate SAC (Seismic Analysis Code) files"
readme = "README.md"
authors = [{ name = "Simon M. Lloyd", email = "simon@slloyd.net" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.15"
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
  "Development Status :: 5 - Production/Stable",
]
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pyproj>=3.7",
  "PyYAML>=6.0.1",
  "requests>=2.32.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-mpl>=0.17",
  "pytest-cov>=5.0",
  "pytest-depends>=1.0.1",
]
lint = ["ruff>=0.11"]
docs = [
  "Sphinx>=7.4",
  "sphinx-rtd-theme>=3.0",
]
dev = ["pysmo[test,lint,docs]"]

[project.urls]
Documentation = "https://pysmo.readthedocs.io"
Repository = "https://github.com/pysmo/pysmo"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["pysmo"]

[tool.hatch.build.targets.sdist]
include = ["/pysmo", "/tests", "/docs", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E741", "UP031"]
