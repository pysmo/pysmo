[tox]
env_list = lint, py{313,314}, report
isolated_build = true

[gh-actions]
python =
  3.13: py313
  3.14: py314, lint

[testenv]
description = run the tests with pytest
passenv =
  UV_*
setenv =
  py{313,314}: COVERAGE_FILE = {env:COVERAGE_FILE:.coverage.{envname}}
  PYSMO_SAVE_FIGS =
depends =
  report: py313, py314
allowlist_externals = uv
commands_pre =
  uv sync --active --inexact --python python
# --dist loadfile: Sybil evaluates every doc example in a file against one
# shared namespace, so they must run in order on a single worker.
commands =
  py.test -n auto --dist loadfile --mpl --mypy --cov --cov-append --cov-report=term-missing --junitxml=junit.xml

[testenv:report]
description = create test report
basepython = python3.14
skip_install = true
skipsdist = true
deps =
  coverage
  coverage[toml]
commands_pre =
commands =
  coverage combine
  coverage report
  coverage xml
  coverage html

[testenv:lint]
description = run linters
basepython = python3.14
skip_install = true
skipsdist = true
deps =
  ruff
commands_pre =
commands =
  ruff check .
  ruff format --check .
